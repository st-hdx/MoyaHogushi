name: TestFlight

# 開発用Mac（macOS 12 / Xcode 14.2）ではApp Store Connectが要求するSDKに届かないため、
# 提出用ビルドはこのワークフローで作る。
#
# 必要なGitHub Secrets（Settings > Secrets and variables > Actions で登録）:
#   APP_STORE_CONNECT_ISSUER_ID   … App Store Connect > Users and Access > Integrations の Issuer ID
#   APP_STORE_CONNECT_KEY_ID      … 同ページで作成したAPIキーの Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY … 同キーの .p8 ファイルの中身をそのまま貼る（ipa書き出し=アップロードにのみ使用）
#   DISTRIBUTION_CERTIFICATE_P12  … 配布用証明書+秘密鍵を base64 エンコードした .p12
#   DISTRIBUTION_CERTIFICATE_PASSWORD … 上記 .p12 のパスワード
#   PROVISIONING_PROFILE_BASE64   … "MoyaHogushi App Store" プロファイル(.mobileprovision)を base64 エンコードしたもの
#
# 署名は手動(Manual)に固定している。-allowProvisioningUpdates によるクラウド署名は
# このApple Developerアカウントで "Your account has roles "", which are not supported
# by Xcode." というエラーを起こし、新規アプリの初回ビルドが通らなかったため
# （Admin権限のAPIキーでも再現、iCloudコンテナを登録しても再現、既存の有効な
# プロビジョニングプロファイルを事前登録しても再現 — Apple側の既知の問題と判断）。
# 証明書とプロファイルを事前に手動生成し、キーチェーンに持ち込んで署名することで回避する。

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号（アップロードのたびに増やす）"
        required: true
        default: "1"

jobs:
  archive-and-upload:
    # macos-15のXcodeは16.x系で、App Store Connectが要求するiOS 26 SDKに届かない。
    # Xcode 26系が入っているmacos-26を使うこと。
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: 最新のXcodeを選択してSDKを検証
        run: |
          ls /Applications | grep -i "^Xcode"
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

          # App Store Connectは2026年4月28日以降、iOS 26 SDK以降でのビルドしか受け付けない。
          # ここで弾いておかないと、アーカイブ成功後のアップロードで初めて失敗する。
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "iOS SDK: $SDK"
          if [ "$SDK" -lt 26 ]; then
            echo "::error::iOS SDK $SDK は古すぎます（26以上が必要）。ランナーのイメージを確認してください。"
            exit 1
          fi

      - name: App Store Connect APIキーを配置
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          # デバッグ: どのAPIキーが使われているか切り分けるため、Key IDの先頭4文字だけを出す
          # (フルの値はGitHub側でマスクされるが、部分文字列は漏れるため先頭4文字に留める)
          echo "KEY_ID prefix: ${KEY_ID:0:4}"

      - name: 配布用証明書とプロビジョニングプロファイルを配置
        env:
          CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/moyahogushi.mobileprovision

      - name: ビルド番号を設定
        run: |
          /usr/bin/sed -i '' \
            "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" \
            MoyaHogushi.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" MoyaHogushi.xcodeproj/project.pbxproj

      - name: アーカイブ
        run: |
          xcodebuild -project MoyaHogushi.xcodeproj \
            -scheme MoyaHogushi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MoyaHogushi.xcarchive \
            archive

      # ランナーは実行後に破棄されるので、アーカイブを残しておく。
      # dSYMを含むため、後からクラッシュログをシンボル化したり、
      # 同じビルドを別の方法で再書き出ししたりできる。
      # 書き出しで失敗したときにも中身を調べられるよう always() で走らせる。
      - name: アーカイブを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoyaHogushi-${{ inputs.build_number }}-xcarchive
          path: build/MoyaHogushi.xcarchive
          retention-days: 30
          if-no-files-found: ignore

      - name: ipaを書き出す
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>Y5RBKYD4FY</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pandagiken.moyahogushi.app</key>
              <string>MoyaHogushi App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/MoyaHogushi.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 後片付け
        if: always()
        run: |
          rm -rf ~/private_keys
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
